name: Build & Test

on:
  push:
    branches: [ master, main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build and test
        run: ./mvnw -B verify

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: weatherstations-api.war
          path: api/target/weatherstations-api.war
          if-no-files-found: error
